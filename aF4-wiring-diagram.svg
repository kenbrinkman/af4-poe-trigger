<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" font-family="Menlo, DejaVu Sans Mono, monospace">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#334155"/>
    </marker>
    <style>
      .w  { stroke:#334155; stroke-width:2; fill:none; }
      .wp { stroke:#b45309; stroke-width:2.6; fill:none; }
      .wg { stroke:#64748b; stroke-width:1.8; fill:none; }
      .box{ fill:#ffffff; stroke:#334155; stroke-width:1.6; }
      .lbl{ font-size:12px; fill:#0f172a; }
      .sm { font-size:10.5px; fill:#475569; }
      .ttl{ font-size:16px; fill:#0f172a; font-weight:700; }
      .hdr{ font-size:11px; fill:#64748b; letter-spacing:.06em; }
      .pin{ font-size:10px; fill:#b45309; }
    </style>
  </defs>

  <rect width="1180" height="720" fill="#f8fafc"/>
  <text x="24" y="30" class="ttl">aF4 PoE trigger — rev D wiring</text>
  <text x="24" y="49" class="sm">Everything except the ESP32 is on the trigger hat. Nothing crosses the isolation band except the PhotoMOS.</text>

  <!-- ===================== logic domain ===================== -->
  <rect x="24" y="66" width="420" height="216" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="40" y="88" class="hdr">LOGIC DOMAIN — ESP32 GROUND</text>

  <rect x="40" y="104" width="158" height="130" class="box"/>
  <text x="52" y="124" class="lbl">ESP32-POE-ISO</text>
  <text x="52" y="140" class="sm">Olimex, PoE 802.3af</text>
  <text x="52" y="155" class="sm">3000 V Ethernet iso.</text>
  <text x="52" y="180" class="pin">EXT2 pin 6</text>
  <text x="52" y="194" class="lbl">GPIO32</text>
  <text x="52" y="216" class="pin">EXT1 pin 3</text>
  <text x="52" y="229" class="lbl">GND</text>

  <path class="w" d="M198 190 H 244" marker-end="url(#ar)"/>
  <rect x="246" y="179" width="60" height="22" class="box"/>
  <text x="252" y="194" class="lbl">220R</text>
  <text x="246" y="172" class="sm">R1  ~9 mA</text>
  <path class="w" d="M306 190 H 396"/>

  <path class="w" d="M226 190 V 240"/>
  <rect x="196" y="240" width="60" height="22" class="box"/>
  <text x="204" y="255" class="lbl">10k</text>
  <text x="262" y="255" class="sm">R2 — boot pulldown</text>

  <path class="wg" d="M226 262 V 272 H 130"/>
  <path class="wg" d="M198 224 H 130 V 290"/>
  <path class="wg" d="M130 272 V 290"/>
  <path class="wg" d="M118 290 H 142 M122 296 H 138 M126 302 H 134"/>

  <!-- ===================== power domain ===================== -->
  <rect x="494" y="66" width="662" height="586" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="510" y="88" class="hdr">FEEDER-POWER DOMAIN — SUPPLY GROUND</text>

  <!-- ===================== isolation band ===================== -->
  <rect x="452" y="66" width="34" height="586" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="469" y="360" class="hdr" text-anchor="middle" transform="rotate(-90 469 360)">ISOLATION BARRIER — 4.3 mm, NO COPPER</text>

  <!-- PhotoMOS straddling the band -->
  <rect x="396" y="148" width="146" height="96" class="box"/>
  <text x="406" y="168" class="lbl">U1  AQY212GS</text>
  <text x="406" y="184" class="sm">PhotoMOS, 1 Form A</text>
  <text x="406" y="199" class="sm">1500 Vrms isolation</text>
  <text x="406" y="220" class="sm">pin 1/2 = LED</text>
  <text x="406" y="234" class="sm">pin 3/4 = MOSFET pair</text>
  <path class="wg" d="M396 228 V 272 H 226"/>


  <!-- input chain -->
  <rect x="512" y="108" width="118" height="44" class="box"/>
  <text x="522" y="126" class="lbl">J1  12 V in</text>
  <text x="522" y="142" class="sm">5.5×2.5, centre +</text>
  <path class="wp" d="M630 130 H 664" marker-end="url(#ar)"/>

  <rect x="666" y="116" width="82" height="28" class="box"/>
  <text x="674" y="135" class="lbl">F1 PPTC</text>
  <text x="666" y="108" class="sm">0.10 A hold</text>
  <path class="wp" d="M748 130 H 782" marker-end="url(#ar)"/>

  <rect x="784" y="116" width="82" height="28" class="box"/>
  <text x="794" y="135" class="lbl">D1 SS14</text>
  <text x="784" y="108" class="sm">reverse-polarity</text>
  <path class="wp" d="M866 130 H 930 V 214"/>
  <text x="880" y="122" class="sm">+12 V</text>

  <!-- D2 clamp -->
  <path class="w" d="M930 160 H 1034 V 178"/>
  <rect x="1004" y="178" width="60" height="24" class="box"/>
  <text x="1012" y="194" class="lbl">D2</text>
  <text x="1004" y="220" class="sm">SMAJ13A input clamp</text>
  <path class="wg" d="M1034 202 V 236"/>

  <!-- C1 -->
  <path class="w" d="M930 186 H 878 V 200"/>
  <rect x="848" y="200" width="60" height="24" class="box"/>
  <text x="856" y="216" class="lbl">C1 10µF</text>
  <path class="wg" d="M878 224 V 236"/>

  <!-- supply ground rail -->
  <path class="wg" d="M560 236 H 1064"/>
  <text x="566" y="230" class="sm">supply ground</text>

  <!-- regulator -->
  <rect x="866" y="266" width="150" height="72" class="box"/>
  <text x="876" y="286" class="lbl">U2  LM1117</text>
  <text x="876" y="302" class="sm">MPX-ADJ, SOT-223</text>
  <text x="876" y="320" class="sm">IN → OUT, ADJ</text>
  <path class="wp" d="M930 214 V 266"/>

  <!-- divider -->
  <path class="w" d="M1016 302 H 1064 V 342"/>
  <rect x="1034" y="342" width="60" height="22" class="box"/>
  <text x="1040" y="357" class="lbl">R4 121R</text>
  <rect x="1034" y="382" width="60" height="22" class="box"/>
  <text x="1040" y="397" class="lbl">R5 887R</text>
  <path class="w" d="M1064 364 V 382"/>
  <path class="wg" d="M1064 404 V 430 H 620"/>
  <text x="1100" y="424" class="sm" text-anchor="end">10.46 V by construction</text>

  <!-- 10.4 V rail -->
  <path class="wp" d="M866 302 H 620 V 190 H 542"/>
  <text x="700" y="296" class="sm">+10.4 V rail  → U1 pin 4</text>

  <!-- C2 -->
  <path class="w" d="M792 302 V 342"/>
  <rect x="762" y="342" width="60" height="24" class="box"/>
  <text x="768" y="358" class="lbl">C2 10µF</text>
  <text x="762" y="380" class="sm">tantalum (ESR)</text>
  <path class="wg" d="M792 366 V 430"/>

  <!-- rail LED -->
  <path class="w" d="M686 302 V 342"/>
  <rect x="656" y="342" width="60" height="22" class="box"/>
  <text x="664" y="357" class="lbl">R6 10k</text>
  <path class="w" d="M686 364 V 384"/>
  <polygon points="676,384 696,384 686,400" fill="#16a34a" stroke="#166534" stroke-width="1.4"/>
  <line x1="674" y1="402" x2="698" y2="402" stroke="#166534" stroke-width="2.2"/>
  <text x="580" y="396" class="sm">D3 rail live</text>
  <path class="wg" d="M686 402 V 430"/>

  <!-- switched trigger output -->
  <path class="wp" d="M542 214 V 486 H 600"/>
  <text x="516" y="470" class="sm">TIP</text>
  <text x="510" y="484" class="sm">switched</text>
  <text x="512" y="498" class="sm">by U1</text>

  <rect x="600" y="474" width="76" height="24" class="box"/>
  <text x="606" y="490" class="lbl">R3 100k</text>
  <text x="600" y="468" class="sm">bleed → guarantees the 0 V re-arm</text>
  <path class="wg" d="M638 498 V 560"/>

  <!-- TVS -->
  <path class="wp" d="M542 486 H 542 M542 540 H 780"/>
  <path class="wp" d="M542 486 V 540"/>
  <rect x="780" y="528" width="88" height="26" class="box"/>
  <text x="790" y="546" class="lbl">D4 TVS</text>
  <text x="780" y="522" class="sm">SMBJ13CA, bidirectional</text>
  <path class="wg" d="M824 554 V 574"/>

  <!-- feed LED -->
  <path class="wp" d="M600 540 V 604"/>
  <rect x="600" y="592" width="70" height="24" class="box"/>
  <text x="608" y="608" class="lbl">R7 10k</text>
  <path class="w" d="M670 604 H 700"/>
  <polygon points="700,596 700,612 716,604" fill="#eab308" stroke="#a16207" stroke-width="1.4"/>
  <line x1="718" y1="594" x2="718" y2="614" stroke="#a16207" stroke-width="2.2"/>
  <text x="730" y="608" class="sm">D5 feed pulsing</text>
  <path class="wg" d="M718 604 V 574"/>

  <!-- output jack -->
  <path class="wp" d="M868 540 H 936"/>
  <rect x="936" y="510" width="164" height="62" class="box"/>
  <text x="948" y="532" class="lbl">J2  3.5 mm jack</text>
  <text x="948" y="548" class="sm">tip = signal</text>
  <text x="948" y="563" class="sm">ring tied to sleeve</text>
  <path class="wg" d="M638 574 H 1018 V 572"/>
  <text x="1100" y="594" class="sm" text-anchor="end">→ patch cable → aF4 0-10 V port</text>

  <text x="510" y="638" class="sm">Feed = ≥9 V held &gt;6 s. Pulse 10 s, then ≥5 min before the next. All timing is enforced on-device.</text>

  <!-- ===================== notes ===================== -->
  <rect x="24" y="300" width="420" height="112" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="322" class="hdr">READ THIS</text>
  <text x="40" y="344" class="sm">GPIO32, not GPIO13. The Olimex board has a factory</text>
  <text x="40" y="359" class="sm">2.2k pull-up on GPIO13 that can partially turn the</text>
  <text x="40" y="374" class="sm">PhotoMOS on while the ESP32 is still in reset.</text>
  <text x="40" y="396" class="sm">The two grounds never meet. Sleeve ties only to the</text>
  <text x="40" y="411" class="sm">feeder supply return — never to ESP32 GND.</text>

  <rect x="24" y="428" width="420" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="450" class="hdr">TEST PADS</text>
  <text x="40" y="472" class="sm">TP1 +12 V     TP2 +10.4 V     TP3 tip</text>
  <text x="40" y="488" class="sm">TP4 supply GND     TP5 ESP32 GND</text>
  <text x="40" y="510" class="sm">Commissioning: TP2 must read 10.3–10.5 V.</text>
</svg>
